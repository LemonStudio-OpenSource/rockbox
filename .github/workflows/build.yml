name: Build Rockbox Firmware

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ 关键改动：缓存路径改为工作目录下的相对路径
      - name: Cache Rockbox toolchain and downloads
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ./rockbox-toolchain
            /tmp/rbdev-dl
          key: ${{ runner.os }}-rockbox-toolchain-arm-${{ hashFiles('tools/rockboxdev.sh', 'tools/toolchain-patches/*') }}
          restore-keys: |
            ${{ runner.os }}-rockbox-toolchain-arm-

      - name: Install dependencies (if cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex bison perl texinfo \
            libtool libtool-bin \
            autoconf automake gettext gawk m4

      # ✅ 关键改动：安装到工作目录下的相对路径
      - name: Setup Rockbox toolchain (if cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd tools
          ./rockboxdev.sh --target=a --prefix=$PWD/../rockbox-toolchain

      # 诊断：检查工具链位置（现在在工作目录下）
      - name: Diagnose toolchain installation
        run: |
          echo "=== Contents of ./rockbox-toolchain ==="
          ls -la ./rockbox-toolchain || echo "Not found in ./"
          echo "=== Searching for arm-elf-eabi-gcc ==="
          find ./rockbox-toolchain -name "arm-elf-eabi-gcc" -type f 2>/dev/null || echo "Not found"

      # ✅ PATH 指向工作目录下的工具链
      - name: Add toolchain to PATH
        run: |
          echo "$PWD/rockbox-toolchain/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          arm-elf-eabi-gcc --version

      - name: Build firmware for iPod Color/Photo
        run: |
          export PATH="$PWD/rockbox-toolchain/bin:$PATH"
          mkdir -p build && cd build
          ../tools/configure --target=20
          make -j$(nproc)
          make zip

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-firmware-ipodcolor
          path: build/rockbox.zip
