name: Build Rockbox Firmware

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rockbox toolchain and downloads
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            $HOME/rockbox-toolchain
            /tmp/rbdev-dl
          # 缓存键：工具链版本 + 补丁文件哈希，保证内容变化时自动重建缓存
          key: ${{ runner.os }}-rockbox-toolchain-arm-${{ hashFiles('tools/rockboxdev.sh', 'tools/toolchain-patches/*') }}
          restore-keys: |
            ${{ runner.os }}-rockbox-toolchain-arm-

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            flex bison perl texinfo \
            libtool libtool-bin \
            autoconf automake gettext gawk m4

      - name: Setup Rockbox toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd tools
          ./rockboxdev.sh --target=a --prefix=$HOME/rockbox-toolchain
          echo "$HOME/rockbox-toolchain/bin" >> $GITHUB_PATH

      - name: Add toolchain to PATH (always)
        run: |
          echo "$HOME/rockbox-toolchain/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          arm-elf-eabi-gcc --version

      - name: Build firmware for iPod Color/Photo
        run: |
          export PATH="$HOME/rockbox-toolchain/bin:$PATH"
          mkdir -p build && cd build
          ../tools/configure --target=20
          make -j$(nproc)
          make zip

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-firmware-ipodcolor
          path: build/rockbox.zip
