          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: Add toolchain to PATH
        run: echo "$PWD/rockbox-toolchain/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: arm-elf-eabi-gcc --version

      - name: Build firmware for iPod Video
        run: |
          export PATH="$PWD/rockbox-toolchain/bin:$PATH"
