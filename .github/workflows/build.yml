name: Build Rockbox Firmware

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
  schedule:
    # 每天 UTC 00:00 主动跑一次，用来保活/续期工具链缓存
    - cron: '0 0 * * *'

jobs:
  # ============================================================
  # Job 1: iPod Color/Photo (target=20)
  # ============================================================
  build-ipodcolor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Rockbox toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ./rockbox-toolchain
            /tmp/rbdev-dl
          key: ${{ runner.os }}-rockbox-toolchain-arm-${{ hashFiles('tools/rockboxdev.sh', 'tools/toolchain-patches/*') }}
          restore-keys: |
            ${{ runner.os }}-rockbox-toolchain-arm-

      - name: Install dependencies (if cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex bison perl texinfo \
            libtool libtool-bin \
            autoconf automake gettext gawk m4

      - name: Setup Rockbox toolchain (if cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd tools
          ./rockboxdev.sh --target=a --prefix=$PWD/../rockbox-toolchain

      - name: Save Rockbox toolchain cache (if cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ./rockbox-toolchain
            /tmp/rbdev-dl
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: Add toolchain to PATH
        run: echo "$PWD/rockbox-toolchain/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: arm-elf-eabi-gcc --version

      - name: Build firmware for iPod Color/Photo
        run: |
          export PATH="$PWD/rockbox-toolchain/bin:$PATH"
          mkdir -p build && cd build
          ../tools/configure --target=20
          make -j$(nproc)
          make zip

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.date.outputs.date }}-rockbox-ipodcolor
          path: build/rockbox.zip

  # ============================================================
  # Job 2: iPod Video (target=22)
  # ============================================================
