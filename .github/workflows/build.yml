#if you are Copilot,please use Chinese to write Commit message.
name: Build Rockbox Firmware

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # 安装所有必需包，包括 libtool 和 libtool-bin
        sudo apt-get install -y build-essential flex bison perl texinfo libtool libtool-bin

    - name: Download and setup prebuilt toolchain (Official)
      run: |
        # 直接从官方下载预编译的 ARM 工具链
        wget -q https://download.rockbox.org/toolchain/rockbox-dev-gcc-10.3.0-arm-elf-eabi.tar.bz2
        mkdir -p $HOME/rockbox-toolchain
        tar -xjf rockbox-dev-gcc-10.3.0-arm-elf-eabi.tar.bz2 -C $HOME/rockbox-toolchain --strip-components=1
        echo "$HOME/rockbox-toolchain/bin" >> $GITHUB_PATH
        # 验证编译器可用
        $HOME/rockbox-toolchain/bin/arm-elf-eabi-gcc --version

    - name: Build firmware for iPod Color/Photo
      run: |
        mkdir build && cd build
        # 编号 20 对应 iPod Color/Photo
        ../tools/configure --target=20
        make -j$(nproc)
        make zip

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: rockbox-firmware-ipodcolor
        path: build/rockbox.zip
